name: Update endgame lineups

on:
  schedule:
    - cron: '15 21 * * *'   # daily 21:15 UTC, about an hour after the 04:00 (UTC+8) reset
  workflow_dispatch:        # "Run workflow" button for manual checks (free: reads the wiki, no AI)

permissions:
  contents: write
  issues: write

# Both bots commit to main, so never let them run at the same time
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Read lineups from the wiki
        id: research
        run: node scripts/research-lineups.mjs

      # Save new lineups straight to the live site
      - name: Commit lineups
        run: |
          git config user.name "reset-bot"
          git config user.email "reset-bot@users.noreply.github.com"
          git add lineups.json
          git diff --cached --quiet && exit 0
          git commit -m "Updated endgame lineups from the wiki"
          git pull --rebase
          git push

      # Anything the bot couldn't confirm becomes an issue for you to look at
      - name: Open issue for review
        if: steps.research.outputs.needs_review == 'true'
        run: |
          open=$(gh issue list --state open --search "Lineups need review in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file lineups-summary.md
          else
            gh issue create --title "Lineups need review" --body-file lineups-summary.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
