name: Verify reset schedule

on:
  schedule:
    - cron: '0 2 * * 1'   # every Monday 02:00 UTC
  workflow_dispatch:      # "Run workflow" button for manual checks

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Ask AI to verify dates
        id: verify
        run: node scripts/verify-resets.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Save confirmed changes and the "last verified" date straight to the live site
      - name: Commit confirmed changes
        run: |
          git config user.name "reset-bot"
          git config user.email "reset-bot@users.noreply.github.com"
          git add resets.json
          git diff --cached --quiet || git commit -m "Verified reset schedule"
          git push

      # Anything the bot couldn't confirm becomes an issue for you to look at
      - name: Open issue for review
        if: steps.verify.outputs.needs_review == 'true'
        run: |
          open=$(gh issue list --state open --search "Reset schedule needs review in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file verify-summary.md
          else
            gh issue create --title "Reset schedule needs review" --body-file verify-summary.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
