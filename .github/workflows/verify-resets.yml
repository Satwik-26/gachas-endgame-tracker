name: Verify reset schedule

on:
  schedule:
    - cron: '0 2 * * 1'   # every Monday 02:00 UTC
  workflow_dispatch:      # "Run workflow" button for manual checks

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ask AI to verify dates
        id: verify
        run: node scripts/verify-resets.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Nothing changed: just bump "last verified" on the main branch
      - name: Commit verified date
        if: steps.verify.outputs.needs_review == 'false'
        run: |
          git config user.name "reset-bot"
          git config user.email "reset-bot@users.noreply.github.com"
          git add resets.json
          git diff --cached --quiet || git commit -m "Verified reset schedule"
          git push

      # Dates changed or something looks odd: open a PR for you to approve
      - name: Open pull request
        if: steps.verify.outputs.needs_review == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: resets.json
          branch: bot/reset-schedule
          title: Reset schedule update
          body-path: verify-summary.md
          commit-message: Update reset schedule
