        Feedback

    <div class="modal-overlay" id="feedback-overlay">
        <div class="modal">
            <h2>Send Feedback</h2>
            <div id="form-wrapper">
                <form id="feedback-form">
                    <input type="text" name="name" placeholder="Your Name (optional)" data-fs-field>
                    <textarea name="message" placeholder="Found a bug? Want a new feature added? Let me know!" data-fs-field required></textarea>
                    <span data-fs-error="message" class="error-text"></span>
                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" id="close-feedback">Cancel</button>
                        <button type="submit" class="btn-submit" data-fs-submit-btn>Send Message</button>
                    </div>
                </form>
                <div data-fs-success class="success-message">
                    Message sent successfully. Thanks for the feedback!
                </div>
                <div data-fs-error class="error-text"></div>
            </div>
        </div>
    </div>

    <script>
        const games = [
            { id: 'genshin', name: 'Genshin Impact',    short: 'Genshin',   icon: '<img src="genshin.png" alt="Genshin Impact">' },
            { id: 'hsr',     name: 'Honkai: Star Rail', short: 'Star Rail', icon: '<img src="hsr.png" alt="Honkai Star Rail">' },
            { id: 'zzz',     name: 'Zenless Zone Zero', short: 'ZZZ',       icon: '<img src="zzz.png" alt="Zenless Zone Zero">' },
            { id: 'wuwa',    name: 'Wuthering Waves',   short: 'WuWa',      icon: '<img src="wuwa.png" alt="Wuthering Waves">' }
        ]

        const HOUR = 3600000
        const DAY = 24 * HOUR
        const ENDING_SOON = 48 * HOUR
        const container = document.getElementById('tracker-container')
        const regionSelect = document.getElementById('region-select')
        const filterBar = document.getElementById('game-filter')
        let modes = []
        let lineups = {}
        let trackedModes = []

        // Saved per browser; storage can be blocked (private mode), so failures fall back to defaults
        function load(key, fallback) {
            try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v) } catch { return fallback }
        }
        function save(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)) } catch {}
        }
        const hiddenGames = new Set(load('endgame.hiddenGames', []))

        // First visit: pick the server that matches the visitor's time zone
        function guessRegion() {
            let tz = ''
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '' } catch {}
            if (tz.startsWith('America/')) return '-5'
            if (/^(Europe|Africa|Atlantic)\//.test(tz)) return '1'
            return '8'
        }
        const savedRegion = load('endgame.region', null)
        regionSelect.value = [...regionSelect.options].some(o => o.value === savedRegion) ? savedRegion : guessRegion()

        // "2026-09-28T04:00" in server-local time -> real UTC ms for a server at `offset` hours
        function serverLocalToUTC(str, offset) {
            return Date.parse(str + ':00Z') - offset * HOUR
        }

        // Each returns the current period as { prev, next } in UTC ms (prev = when it started)
        function monthlyPeriod(day, hour, offset, now) {
            const shifted = new Date(now + offset * HOUR)
            const y = shifted.getUTCFullYear(), m = shifted.getUTCMonth()
            const at = k => Date.UTC(y, m + k, day, hour) - offset * HOUR   // Date.UTC rolls month overflow into the year
            return now < at(0) ? { prev: at(-1), next: at(0) } : { prev: at(0), next: at(1) }
        }

        // Overrides are one-off reset dates that break the usual rhythm (a shorter or longer period).
        // Each replaces the regular reset nearest to it, and the cycle carries on from the latest one that has passed.
        function cyclePeriod(mode, offset, now) {
            const cycle = mode.days * DAY
            const points = [{ at: serverLocalToUTC(mode.anchor, offset) },
                ...(mode.overrides || []).map(o => ({ at: serverLocalToUTC(o.date, offset), reason: o.reason }))]
                .sort((a, b) => a.at - b.at)
            const past = points.filter(p => p.at <= now)
            const upcoming = points.find(p => p.at > now)
            if (!past.length) return { prev: upcoming.at - cycle, next: upcoming.at, reason: upcoming.reason }

            const base = past[past.length - 1].at
            const prev = base + Math.floor((now - base) / cycle) * cycle
            if (upcoming) {
                const replaced = base + Math.max(1, Math.round((upcoming.at - base) / cycle)) * cycle
                if (prev + cycle >= replaced) return { prev: replaced - cycle, next: upcoming.at, reason: upcoming.reason }
            }
            return { prev, next: prev + cycle }
        }

        // Lineups come from a bot that researches the web, so every value goes in as text, never as HTML
        function el(tag, className, text) {
            const node = document.createElement(tag)
            if (className) node.className = className
            if (text !== undefined) node.textContent = text
            return node
        }

        const DATE_FORMAT = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }
        const localDate = ms => new Date(ms).toLocaleDateString(undefined, DATE_FORMAT)

        // Writes a mode's countdown into the elements whose ids end in `-${suffix}` (a card, or the detail view)
        function fillCountdown(suffix, mode, now) {
            const diff = Math.max(0, mode.currentDiff)
            const byId = p => document.getElementById(`${p}-${suffix}`)
            const set = (p, v) => { const el = byId(p); if (el) el.innerText = String(v).padStart(2, '0') }
            set('d', Math.floor(diff / DAY))
            set('h', Math.floor(diff / HOUR) % 24)
            set('m', Math.floor(diff / 60000) % 60)
            set('s', Math.floor(diff / 1000) % 60)

            const { prev, next, reason } = mode.period
            const elapsed = Math.min(1, Math.max(0, (now - prev) / (next - prev)))
            const bar = byId('bar')
            if (bar) bar.style.width = (elapsed * 100).toFixed(2) + '%'
            const dayEl = byId('day')
            if (dayEl) dayEl.innerText = `Day ${Math.min(Math.floor((now - prev) / DAY) + 1, Math.round((next - prev) / DAY))} of ${Math.round((next - prev) / DAY)}`
            byId('card')?.classList.toggle('ending', diff < ENDING_SOON)
            const note = byId('note')
            if (note) {
                note.hidden = !reason
                note.innerText = reason ? `Irregular period: ${reason}` : ''
            }
            const dateEl = byId('date')
            if (dateEl) dateEl.innerText = 'Local Time: ' + localDate(mode.targetMs)
        }

        // The saved lineup, but only if it is for the period that is live right now
        function currentLineup(mode, offset) {
            const start = new Date(mode.period.prev + offset * HOUR).toISOString().slice(0, 16)
            const l = lineups[mode.id]
            return l && l.periodStart === start && Array.isArray(l.difficulties) && l.difficulties.length ? l : null
        }
        const isConfirmed = l => l.locked || l.difficulties.every(d => d.confirmed)

        function renderCardMore(mode, offset) {
            const slot = document.getElementById(`more-${mode.id}`)
            const l = currentLineup(mode, offset)
            const key = l ? `${l.periodStart}|${l.title}` : ''
            if (!slot || slot.dataset.key === key) return
            slot.dataset.key = key
            slot.replaceChildren()
            if (l?.title) slot.append(el('span', 'more-title', l.title))
            slot.append(el('span', 'more-cta', l ? 'View lineup →' : 'View details →'))
        }

        // ---------- Detail view (#<mode id>) ----------
        const detailView = document.getElementById('detail-view')
        const listView = document.getElementById('list-view')
        const chosenDifficulty = {}
        let detailMode = null, detailKey = '', listScroll = 0

        function typeChips(types) {
            const wrap = el('span', 'weak')
            if (types.length) wrap.setAttribute('aria-label', types.join(', '))
            for (const t of types) {
                const chip = el('span', 'el', t)
                chip.dataset.el = t
                chip.setAttribute('aria-hidden', 'true')
                wrap.append(chip)
            }
            return wrap
        }

        // Name + description list, used for period effects, buff choices and boss traits
        function effectList(items, className = 'effects') {
            const listEl = el('dl', className)
            for (const item of items) {
                listEl.append(el('dt', '', item.name))
                if (item.desc) listEl.append(el('dd', '', item.desc))
            }
            return listEl
        }

        function lineupPanel(mode, l) {
            const panel = el('div', 'panel')
            panel.append(el('div', 'panel-label', 'This period'))
            if (!l) {
                panel.append(el('p', 'lineup-empty', trackedModes.includes(mode.id)
                    ? 'No lineup for this period yet. It is read from the wiki after each reset, so check back soon.'
                    : 'Boss lineups aren\'t tracked for this mode yet.'))
                return panel
            }

            const head = el('div', 'lineup-head')
            head.append(el('span', 'lineup-name', l.title || mode.name))
            if (l.locked) head.append(el('span', 'tag-hand', 'Checked by hand'))
            panel.append(head)
            if (l.effects?.length) panel.append(effectList(l.effects))

            const diffs = l.difficulties
            const active = diffs.find(d => d.key === chosenDifficulty[mode.id]) || diffs[0]
            const tabs = el('div', 'tabs')
            tabs.setAttribute('role', 'tablist')
            tabs.setAttribute('aria-label', 'Difficulty')
            for (const d of diffs) {
                const tab = el('button', 'tab', d.name)
                tab.type = 'button'
                tab.setAttribute('role', 'tab')
                tab.setAttribute('aria-selected', d === active)
                if (!d.confirmed && !l.locked) tab.append(el('span', 'tag-unconfirmed', 'Incomplete'))
                tab.addEventListener('click', () => { chosenDifficulty[mode.id] = d.key; renderDetail() })
                tabs.append(tab)
            }
            panel.append(tabs)
            if (active.level) panel.append(el('div', 'tab-meta', `Enemy level ${active.level}`))

            const nodes = el('div', 'nodes')
            nodes.setAttribute('role', 'tabpanel')
            for (const part of active.parts) {
                const node = el('div', 'node')
                node.append(el('div', 'node-label', part.label), el('div', 'node-boss', part.boss || 'Unknown boss'))
                if (part.corruption) node.append(el('div', 'node-corruption', part.corruption))
                if (part.types?.length) node.append(el('div', 'node-types-label', 'Recommended types'), typeChips(part.types))
                if (part.traits?.length) {
                    const traits = el('details', 'node-traits')
                    traits.append(el('summary', '', `Boss traits (${part.traits.length})`), effectList(part.traits, 'effects compact'))
                    node.append(traits)
                }
                // Apocalyptic Shadow: buffs the player picks for this node
                const choice = (l.choices || []).find(c => c.label === `${part.label} buff`)
                if (choice) {
                    const buffs = el('details', 'node-traits')
                    buffs.append(el('summary', '', `Buff options (${choice.options.length})`), effectList(choice.options, 'effects compact'))
                    node.append(buffs)
                }
                nodes.append(node)
            }
            panel.append(nodes)

            // Period-wide choices that aren't tied to a node, e.g. Pure Fiction's Cacophony
            for (const group of (l.choices || []).filter(c => !/^Node \d+ buff$/.test(c.label))) {
                panel.append(el('div', 'panel-label choice-label', `${group.label}: choose one`), effectList(group.options))
            }

            const foot = el('p', 'lineup-foot', l.locked ? 'Checked by hand. ' : '')
            if (l.source?.url && /^https:\/\//.test(l.source.url)) {
                foot.append('From the ')
                const a = el('a', '', l.source.name || 'wiki')
                a.href = l.source.url
                a.target = '_blank'
                a.rel = 'noopener noreferrer'
                foot.append(a, ` (community-edited)${l.updatedAt ? `, updated ${new Date(l.updatedAt + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}` : ''}.`)
            }
            panel.append(foot)
            return panel
        }

        function renderDetail() {
            const mode = detailMode, offset = parseFloat(regionSelect.value)
            const game = games.find(g => g.id === mode.gameId)
            const l = currentLineup(mode, offset)
            detailKey = `${mode.period.prev}|${l ? l.periodStart : ''}`

            const back = el('a', 'back-link', '← All endgames')
            back.href = '#'
            const head = el('div', 'detail-head')
            const icon = el('img')
            icon.src = `${game.id}.png`
            icon.alt = ''
            const titles = el('div')
            const heading = el('h2', '', mode.name)
            heading.tabIndex = -1
            titles.append(el('div', 'detail-game', game.name), heading)
            head.append(icon, titles)

            const timer = el('div', 'panel')
            timer.id = 'card-detail'
            timer.innerHTML = `
                <div class="panel-label">Resets in</div>
                <div class="timer-grid">
                    <div class="time-box"><span class="time-val" id="d-detail">00</span><span class="time-label">Days</span></div>
                    <div class="time-box"><span class="time-val" id="h-detail">00</span><span class="time-label">Hours</span></div>
                    <div class="time-box"><span class="time-val" id="m-detail">00</span><span class="time-label">Mins</span></div>
                    <div class="time-box"><span class="time-val" id="s-detail">00</span><span class="time-label">Secs</span></div>
                </div>
                <div class="progress"><div class="progress-fill" id="bar-detail"></div></div>
                <div class="progress-meta"><span id="day-detail"></span><span class="ending-label">Ending soon</span></div>
                <div class="override-note" id="note-detail" hidden></div>
                <div class="period-dates"><div><span>Started</span><b id="start-detail"></b></div><div><span>Resets</span><b id="end-detail"></b></div></div>`

            const layout = el('div', 'detail-layout')
            layout.append(timer, lineupPanel(mode, l))
            detailView.className = game.id
            detailView.replaceChildren(back, head, layout)
            updateDetail(offset, Date.now())
        }

        function updateDetail(offset, now) {
            const mode = detailMode
            // Period rolled over, or the server changed: rebuild so the lineup matches
            if (`${mode.period.prev}|${currentLineup(mode, offset)?.periodStart || ''}` !== detailKey) return renderDetail()
            fillCountdown('detail', mode, now)
            document.getElementById('start-detail').innerText = localDate(mode.period.prev)
            document.getElementById('end-detail').innerText = localDate(mode.period.next)
        }

        // #moc opens that mode; anything else shows the list
        function route() {
            const mode = modes.find(m => m.id === decodeURIComponent(location.hash.slice(1)))
            if (mode && !detailMode) listScroll = window.scrollY
            detailMode = mode || null
            listView.hidden = !!mode
            detailView.hidden = !mode
            document.title = mode ? `${mode.name} | Gacha Endgame Tracker` : 'Gacha Endgame Tracker | Live Reset Timers'
            if (mode) {
                renderDetail()
                window.scrollTo(0, 0)
                detailView.querySelector('h2')?.focus({ preventScroll: true })   // screen readers land on the new view
            } else {
                window.scrollTo(0, listScroll)
            }
        }

        function renderFilter() {
            filterBar.innerHTML = ''
            games.forEach(game => {
                if (!modes.some(m => m.gameId === game.id)) return
                const chip = document.createElement('button')
                chip.type = 'button'
                chip.className = `chip ${game.id}`
                chip.dataset.game = game.id
                chip.innerHTML = `<img src="${game.id}.png" alt=""><span>${game.short}</span>`
                chip.addEventListener('click', () => {
                    hiddenGames.has(game.id) ? hiddenGames.delete(game.id) : hiddenGames.add(game.id)
                    save('endgame.hiddenGames', [...hiddenGames])
                    applyHidden()
                })
                filterBar.appendChild(chip)
            })
        }

        function applyHidden() {
            filterBar.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', !hiddenGames.has(chip.dataset.game)))
            const sections = container.querySelectorAll('.game-section')
            sections.forEach(s => { s.hidden = hiddenGames.has(s.dataset.game) })
            document.getElementById('all-hidden').hidden = [...sections].some(s => !s.hidden)
        }

        function render() {
            container.innerHTML = '<p class="status-msg" id="all-hidden" hidden>All games are hidden. Tap one above to show it again.</p>'
            games.forEach(game => {
                const gameModes = modes.filter(m => m.gameId === game.id)
                if (gameModes.length === 0) return

                const section = document.createElement('div')
                section.className = `game-section ${game.id}`
                section.dataset.game = game.id
                section.innerHTML = `
                    <div class="game-header">${game.icon}<h2>${game.name}</h2></div>
                    <div class="grid" id="grid-${game.id}"></div>`
                container.appendChild(section)
                const grid = section.querySelector('.grid')

                gameModes.forEach(mode => {
                    const card = document.createElement('div')
                    card.className = 'card'
                    card.id = `card-${mode.id}`
                    card.innerHTML = `
                        <div class="mode-header">
                            <div class="title-group">
                                <span class="next-badge" id="badge-${mode.id}">🔥 Next Up</span>
                                <div class="mode-title">${mode.name}</div>
                            </div>
                            <div class="status-dot"></div>
                        </div>
                        <div class="timer-grid">
                            <div class="time-box"><span class="time-val" id="d-${mode.id}">00</span><span class="time-label">Days</span></div>
                            <div class="time-box"><span class="time-val" id="h-${mode.id}">00</span><span class="time-label">Hours</span></div>
                            <div class="time-box"><span class="time-val" id="m-${mode.id}">00</span><span class="time-label">Mins</span></div>
                            <div class="time-box"><span class="time-val" id="s-${mode.id}">00</span><span class="time-label">Secs</span></div>
                        </div>
                        <div class="progress"><div class="progress-fill" id="bar-${mode.id}"></div></div>
                        <div class="progress-meta"><span id="day-${mode.id}"></span><span class="ending-label">Ending soon</span></div>
                        <div class="override-note" id="note-${mode.id}" hidden></div>
                        <div class="date-display" id="date-${mode.id}"></div>
                        <div class="card-more" id="more-${mode.id}"><span class="more-cta">View details →</span></div>
                        <a class="card-open" href="#${mode.id}" aria-label="${mode.name}: open details"></a>`
                    grid.appendChild(card)
                })
            })
        }

        function updateTimers() {
            const offset = parseFloat(regionSelect.value)
            const now = Date.now()

            modes.forEach(mode => {
                mode.period = mode.type === 'monthly'
                    ? monthlyPeriod(mode.day, mode.hour ?? 4, offset, now)
                    : cyclePeriod(mode, offset, now)
                mode.targetMs = mode.period.next
                mode.currentDiff = mode.targetMs - now
            })

            games.forEach(game => {
                modes.filter(m => m.gameId === game.id)
                    .sort((a, b) => a.currentDiff - b.currentDiff)
                    .forEach((mode, index) => {
                        const card = document.getElementById(`card-${mode.id}`)
                        const badge = document.getElementById(`badge-${mode.id}`)
                        if (card) card.style.order = index
                        if (badge) badge.classList.toggle('active', index === 0)
                    })
            })

            modes.forEach(mode => {
                fillCountdown(mode.id, mode, now)
                renderCardMore(mode, offset)
            })
            if (detailMode) updateDetail(offset, now)
        }

        async function init() {
            // Lineups are optional extras: if they fail to load, the timers still work
            const lineupsReq = fetch('lineups.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)
            let data
            try {
                const res = await fetch('resets.json', { cache: 'no-store' })
                if (!res.ok) throw new Error(`HTTP ${res.status}`)
                data = await res.json()
            } catch (e) {
                console.error('Could not load resets.json', e)
                container.innerHTML = location.protocol === 'file:'
                    ? '<p class="status-msg">Couldn\'t load the reset schedule. Browsers block it when the page is opened straight from a file, so view it through GitHub Pages or a local web server.</p>'
                    : '<p class="status-msg">Couldn\'t load the reset schedule. Check your connection and refresh the page.</p>'
                return
            }
            modes = data.modes
            const lineupData = await lineupsReq
            lineups = lineupData?.modes || {}
            trackedModes = lineupData?.tracked || []
            document.getElementById('verified').innerText = data.lastVerified
                ? `Schedule last verified ${new Date(data.lastVerified + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' })}`
                : ''
            renderFilter()
            render()
            applyHidden()
            updateTimers()
            route()
            setInterval(updateTimers, 1000)
            window.addEventListener('hashchange', route)
            regionSelect.addEventListener('change', () => {
                save('endgame.region', regionSelect.value)
                updateTimers()
            })
        }
        init()

        const overlay = document.getElementById('feedback-overlay')
        document.getElementById('open-feedback').addEventListener('click', () => overlay.classList.add('active'))
        document.getElementById('close-feedback').addEventListener('click', () => overlay.classList.remove('active'))
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active') })

        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments) }
        formspree('initForm', { formElement: '#feedback-form', formId: 'xaenbozz' })
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
</body>
</html>
