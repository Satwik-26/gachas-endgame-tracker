    <style>
        :root {
            --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            --font-mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
            --glass-bg: rgba(20, 20, 25, 0.45);
            --glass-border: rgba(255, 255, 255, 0.1);
            --box-bg: rgba(0, 0, 0, 0.4);
            --hsr-accent: #b388ff;
            --hsr-glow: rgba(179, 136, 255, 0.4);
            --genshin-accent: #00d2ff;
            --genshin-glow: rgba(0, 210, 255, 0.4);
            --zzz-accent: #ccff00;
            --zzz-glow: rgba(204, 255, 0, 0.4);
            --wuwa-accent: #fbbf24;
            --wuwa-glow: rgba(251, 191, 36, 0.4);
            --warn: #ff6b6b;
            --warn-glow: rgba(255, 107, 107, 0.45);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-display); -webkit-font-smoothing: antialiased; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { background: linear-gradient(-45deg, #07090e, #13111c, #0d1a20, #0a0a0a); background-size: 400% 400%; animation: gradientMove 20s ease infinite; color: #ffffff; min-height: 100vh; padding: 4rem 1.5rem; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 1.5rem; text-align: center; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .controls { margin-bottom: 1rem; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1rem; background: rgba(255, 255, 255, 0.05); padding: 0.75rem 1.5rem; border-radius: 99px; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); }
        .controls label { font-size: 0.9rem; color: #a1a1aa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        select { background: transparent; color: #fff; border: none; font-size: 1rem; font-weight: 700; outline: none; cursor: pointer; appearance: none; padding-right: 1.5rem; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23a1a1aa' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right center; }
        select option { color: #000; }
        .verified { font-size: 0.8rem; color: #71717a; margin-bottom: 4rem; text-align: center; }
        #tracker-container { width: 100%; max-width: 1350px; display: flex; flex-direction: column; gap: 5rem; }
        .game-section { display: flex; flex-direction: column; gap: 2rem; }
        .game-header { display: flex; align-items: center; gap: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1.25rem; }
        .game-header img { width: 44px; height: 44px; border-radius: 10px; box-shadow: 0 0 16px var(--card-glow); border: 1px solid rgba(255,255,255,0.1); }
        .game-header h2 { font-size: clamp(1.4rem, 6vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 1.5rem; }
        .card { position: relative; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 1.75rem; display: flex; flex-direction: column; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); overflow: hidden; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--card-accent); box-shadow: 0 0 20px var(--card-glow); opacity: 0.8; transition: opacity 0.3s ease; }
        @media (hover: hover) {
            .card:hover { transform: translateY(-5px) scale(1.01); border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px var(--card-glow); }
            .card:hover::before { opacity: 1; }

        .mode-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; }
        .title-group { display: flex; flex-direction: column; gap: 0.6rem; }
        .mode-title { font-size: 1.45rem; font-weight: 700; color: #ffffff; letter-spacing: -0.01em; }
        .next-badge { display: inline-flex; align-items: center; background: var(--card-accent); color: #000; padding: 0.25rem 0.85rem; border-radius: 99px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; box-shadow: 0 0 12px var(--card-glow); width: fit-content; opacity: 0; transform: translateY(-5px); transition: opacity 0.3s ease, transform 0.3s ease; }
        .next-badge.active { opacity: 1; transform: translateY(0); }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--card-accent); box-shadow: 0 0 12px var(--card-accent); animation: pulse 2s infinite; margin-top: 0.6rem; }
        .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
        .time-box { background: var(--box-bg); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 1rem 0.25rem; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.02); }
        .time-val { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--card-accent); text-shadow: 0 0 15px var(--card-glow); margin-bottom: 0.4rem; }
        .time-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; color: #a1a1aa; text-transform: uppercase; }
        .date-display { font-size: 0.8rem; color: #a1a1aa; text-align: center; margin-top: auto; font-weight: 600; background: rgba(0,0,0,0.2); padding: 0.75rem; border-radius: 10px; }
        .hsr { --card-accent: var(--hsr-accent); --card-glow: var(--hsr-glow); }
        .genshin { --card-accent: var(--genshin-accent); --card-glow: var(--genshin-glow); }
        .zzz { --card-accent: var(--zzz-accent); --card-glow: var(--zzz-glow); }
        .wuwa { --card-accent: var(--wuwa-accent); --card-glow: var(--wuwa-glow); }
        .filter { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; }
        .chip { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid var(--glass-border); border-radius: 99px; padding: 0.35rem 0.9rem 0.35rem 0.35rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s ease, border-color 0.2s ease, background 0.2s ease; }
        .chip img { width: 24px; height: 24px; border-radius: 7px; }
        .chip[aria-pressed="true"] { border-color: var(--card-accent); background: rgba(255, 255, 255, 0.1); }
        .chip[aria-pressed="false"] { opacity: 0.45; }
        .chip[aria-pressed="false"] img { filter: grayscale(1); }
        .chip:focus-visible, select:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
        .game-section[hidden] { display: none; }
        .status-msg { text-align: center; color: #a1a1aa; font-size: 1rem; line-height: 1.6; padding: 2rem 1rem; }

        .progress { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-bottom: 0.6rem; }
        .progress-fill { height: 100%; width: 0; background: var(--card-accent); box-shadow: 0 0 10px var(--card-glow); border-radius: inherit; transition: width 0.5s linear; }
        .progress-meta { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; color: #a1a1aa; letter-spacing: 0.03em; margin-bottom: 1.25rem; }
        .ending-label { color: var(--warn); visibility: hidden; text-transform: uppercase; letter-spacing: 0.08em; }
        .card.ending .ending-label { visibility: visible; }
        .card.ending .progress-fill { background: var(--warn); box-shadow: 0 0 10px var(--warn-glow); }
        .override-note { font-size: 0.8rem; line-height: 1.45; color: #e4e4e7; background: rgba(255, 255, 255, 0.06); border-left: 3px solid var(--card-accent); padding: 0.6rem 0.75rem; border-radius: 8px; margin-bottom: 1rem; }

        @media (max-width: 600px) {
            body { padding: 2.5rem 1rem 6rem; }
            #tracker-container { gap: 3.5rem; }
            .verified { margin-bottom: 2.5rem; }
            .card { padding: 1.25rem; }
            .timer-grid { gap: 0.5rem; }
            .time-val { font-size: 1.35rem; }
        }
        /* A moving full-page gradient and heavy blur behind every card are costly for phone GPUs */
        @media (max-width: 900px), (hover: none) {
            body { animation: none; }
            .card { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(20, 20, 25, 0.85); }
            .controls, .feedback-btn, .modal-overlay { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        }
        @media (prefers-reduced-motion: reduce) { body, .status-dot { animation: none; } .card, .progress-fill { transition: none; } }

        .feedback-btn { position: fixed; bottom: 2rem; right: 2rem; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 0.75rem 1.5rem; border-radius: 99px; font-size: 0.9rem; font-weight: 700; cursor: pointer; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s ease; z-index: 100; display: flex; align-items: center; gap: 0.5rem; }
        .feedback-btn:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 2.5rem; border-radius: 24px; width: 90%; max-width: 450px; transform: translateY(20px); transition: transform 0.3s ease; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal h2 { margin-bottom: 1.5rem; font-size: 1.5rem; letter-spacing: -0.01em; }
        .modal input, .modal textarea { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; font-size: 1rem; outline: none; font-family: var(--font-display); }
        .modal input:focus, .modal textarea:focus { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 0 10px rgba(255,255,255,0.1); }
        .modal textarea { resize: vertical; min-height: 120px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem; }
        .btn-cancel { background: transparent; border: none; color: #a1a1aa; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
        .btn-submit { background: #fff; color: #000; border: none; padding: 0.75rem 1.5rem; border-radius: 12px; font-weight: 700; cursor: pointer; transition: transform 0.2s; }
        .btn-submit:hover { transform: scale(1.05); }
        .success-message { display: none; color: var(--zzz-accent); font-weight: 700; text-align: center; padding: 2rem 0; font-size: 1.1rem; }
        [data-fs-form-status="success"] .success-message { display: block; }
        [data-fs-form-status="success"] #feedback-form { display: none; }
        .error-text { color: #ff4444; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
        [data-fs-error]:not(:empty) { display: block; }
    </style>
</head>
<body>

    <h1>Endgame Resets</h1>

    <div class="controls">
        <label for="region-select">Server</label>
        <select id="region-select">
            <option value="8">Asia (UTC+8)</option>
            <option value="-5">America (UTC-5)</option>
            <option value="1">Europe (UTC+1)</option>
        </select>
    </div>
    <div class="filter" id="game-filter" role="group" aria-label="Games to show"></div>
    <p class="verified" id="verified"></p>

    <div id="tracker-container"></div>

    <button class="feedback-btn" id="open-feedback">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        Feedback
    </button>

    <div class="modal-overlay" id="feedback-overlay">
        <div class="modal">
            <h2>Send Feedback</h2>
            <div id="form-wrapper">
                <form id="feedback-form">
                    <input type="text" name="name" placeholder="Your Name (optional)" data-fs-field>
                    <textarea name="message" placeholder="Found a bug? Want a new feature added? Let me know!" data-fs-field required></textarea>
                    <span data-fs-error="message" class="error-text"></span>
                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" id="close-feedback">Cancel</button>
                        <button type="submit" class="btn-submit" data-fs-submit-btn>Send Message</button>
                    </div>
                </form>
                <div data-fs-success class="success-message">
                    Message sent successfully. Thanks for the feedback!
                </div>
                <div data-fs-error class="error-text"></div>
            </div>
        </div>
    </div>

    <script>
        const games = [
            { id: 'genshin', name: 'Genshin Impact',    short: 'Genshin',   icon: '<img src="genshin.png" alt="Genshin Impact">' },
            { id: 'hsr',     name: 'Honkai: Star Rail', short: 'Star Rail', icon: '<img src="hsr.png" alt="Honkai Star Rail">' },
            { id: 'zzz',     name: 'Zenless Zone Zero', short: 'ZZZ',       icon: '<img src="zzz.png" alt="Zenless Zone Zero">' },
            { id: 'wuwa',    name: 'Wuthering Waves',   short: 'WuWa',      icon: '<img src="wuwa.png" alt="Wuthering Waves">' }
        ]

        const HOUR = 3600000
        const DAY = 24 * HOUR
        const ENDING_SOON = 48 * HOUR
        const container = document.getElementById('tracker-container')
        const regionSelect = document.getElementById('region-select')
        const filterBar = document.getElementById('game-filter')
        let modes = []

        // Saved per browser; storage can be blocked (private mode), so failures fall back to defaults
        function load(key, fallback) {
            try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v) } catch { return fallback }
        }
        function save(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)) } catch {}
        }
        const hiddenGames = new Set(load('endgame.hiddenGames', []))

        // First visit: pick the server that matches the visitor's time zone
        function guessRegion() {
            let tz = ''
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '' } catch {}
            if (tz.startsWith('America/')) return '-5'
            if (/^(Europe|Africa|Atlantic)\//.test(tz)) return '1'
            return '8'
        }
        const savedRegion = load('endgame.region', null)
        regionSelect.value = [...regionSelect.options].some(o => o.value === savedRegion) ? savedRegion : guessRegion()

        // "2026-09-28T04:00" in server-local time -> real UTC ms for a server at `offset` hours
        function serverLocalToUTC(str, offset) {
            return Date.parse(str + ':00Z') - offset * HOUR
        }

        // Each returns the current period as { prev, next } in UTC ms (prev = when it started)
        function monthlyPeriod(day, hour, offset, now) {
            const shifted = new Date(now + offset * HOUR)
            const y = shifted.getUTCFullYear(), m = shifted.getUTCMonth()
            const at = k => Date.UTC(y, m + k, day, hour) - offset * HOUR   // Date.UTC rolls month overflow into the year
            return now < at(0) ? { prev: at(-1), next: at(0) } : { prev: at(0), next: at(1) }
        }

        // Overrides are one-off reset dates that break the usual rhythm (a shorter or longer period).
        // Each replaces the regular reset nearest to it, and the cycle carries on from the latest one that has passed.
        function cyclePeriod(mode, offset, now) {
            const cycle = mode.days * DAY
            const points = [{ at: serverLocalToUTC(mode.anchor, offset) },
                ...(mode.overrides || []).map(o => ({ at: serverLocalToUTC(o.date, offset), reason: o.reason }))]
                .sort((a, b) => a.at - b.at)
            const past = points.filter(p => p.at <= now)
            const upcoming = points.find(p => p.at > now)
            if (!past.length) return { prev: upcoming.at - cycle, next: upcoming.at, reason: upcoming.reason }

            const base = past[past.length - 1].at
            const prev = base + Math.floor((now - base) / cycle) * cycle
            if (upcoming) {
                const replaced = base + Math.max(1, Math.round((upcoming.at - base) / cycle)) * cycle
                if (prev + cycle >= replaced) return { prev: replaced - cycle, next: upcoming.at, reason: upcoming.reason }
            }
            return { prev, next: prev + cycle }
        }

        function renderFilter() {
            filterBar.innerHTML = ''
            games.forEach(game => {
                if (!modes.some(m => m.gameId === game.id)) return
                const chip = document.createElement('button')
                chip.type = 'button'
                chip.className = `chip ${game.id}`
                chip.dataset.game = game.id
                chip.innerHTML = `<img src="${game.id}.png" alt=""><span>${game.short}</span>`
                chip.addEventListener('click', () => {
                    hiddenGames.has(game.id) ? hiddenGames.delete(game.id) : hiddenGames.add(game.id)
                    save('endgame.hiddenGames', [...hiddenGames])
                    applyHidden()
                })
                filterBar.appendChild(chip)
            })
        }

        function applyHidden() {
            filterBar.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', !hiddenGames.has(chip.dataset.game)))
            const sections = container.querySelectorAll('.game-section')
            sections.forEach(s => { s.hidden = hiddenGames.has(s.dataset.game) })
            document.getElementById('all-hidden').hidden = [...sections].some(s => !s.hidden)
        }

        function render() {
            container.innerHTML = '<p class="status-msg" id="all-hidden" hidden>All games are hidden. Tap one above to show it again.</p>'
            games.forEach(game => {
                const gameModes = modes.filter(m => m.gameId === game.id)
                if (gameModes.length === 0) return

                const section = document.createElement('div')
                section.className = `game-section ${game.id}`
                section.dataset.game = game.id
                section.innerHTML = `
                    <div class="game-header">${game.icon}<h2>${game.name}</h2></div>
                    <div class="grid" id="grid-${game.id}"></div>`
                container.appendChild(section)
                const grid = section.querySelector('.grid')

                gameModes.forEach(mode => {
                    const card = document.createElement('div')
                    card.className = 'card'
                    card.id = `card-${mode.id}`
                    card.innerHTML = `
                        <div class="mode-header">
                            <div class="title-group">
                                <span class="next-badge" id="badge-${mode.id}">🔥 Next Up</span>
                                <div class="mode-title">${mode.name}</div>
                            </div>
                            <div class="status-dot"></div>
                        </div>
                        <div class="timer-grid">
                            <div class="time-box"><span class="time-val" id="d-${mode.id}">00</span><span class="time-label">Days</span></div>
                            <div class="time-box"><span class="time-val" id="h-${mode.id}">00</span><span class="time-label">Hours</span></div>
                            <div class="time-box"><span class="time-val" id="m-${mode.id}">00</span><span class="time-label">Mins</span></div>
                            <div class="time-box"><span class="time-val" id="s-${mode.id}">00</span><span class="time-label">Secs</span></div>
                        </div>
                        <div class="progress"><div class="progress-fill" id="bar-${mode.id}"></div></div>
                        <div class="progress-meta"><span id="day-${mode.id}"></span><span class="ending-label">Ending soon</span></div>
                        <div class="override-note" id="note-${mode.id}" hidden></div>
                        <div class="date-display" id="date-${mode.id}"></div>`
                    grid.appendChild(card)
                })
            })
        }

        function updateTimers() {
            const offset = parseFloat(regionSelect.value)
            const now = Date.now()

            modes.forEach(mode => {
                mode.period = mode.type === 'monthly'
                    ? monthlyPeriod(mode.day, mode.hour ?? 4, offset, now)
                    : cyclePeriod(mode, offset, now)
                mode.targetMs = mode.period.next
                mode.currentDiff = mode.targetMs - now
            })

            games.forEach(game => {
                modes.filter(m => m.gameId === game.id)
                    .sort((a, b) => a.currentDiff - b.currentDiff)
                    .forEach((mode, index) => {
                        const card = document.getElementById(`card-${mode.id}`)
                        const badge = document.getElementById(`badge-${mode.id}`)
                        if (card) card.style.order = index
                        if (badge) badge.classList.toggle('active', index === 0)
                    })
            })

            modes.forEach(mode => {
                const diff = Math.max(0, mode.currentDiff)
                const set = (p, v) => { const el = document.getElementById(`${p}-${mode.id}`); if (el) el.innerText = String(v).padStart(2, '0') }
                set('d', Math.floor(diff / DAY))
                set('h', Math.floor(diff / HOUR) % 24)
                set('m', Math.floor(diff / 60000) % 60)
                set('s', Math.floor(diff / 1000) % 60)

                const { prev, next, reason } = mode.period
                const elapsed = Math.min(1, Math.max(0, (now - prev) / (next - prev)))
                const bar = document.getElementById(`bar-${mode.id}`)
                if (bar) bar.style.width = (elapsed * 100).toFixed(2) + '%'
                const dayEl = document.getElementById(`day-${mode.id}`)
                if (dayEl) dayEl.innerText = `Day ${Math.min(Math.floor((now - prev) / DAY) + 1, Math.round((next - prev) / DAY))} of ${Math.round((next - prev) / DAY)}`
                document.getElementById(`card-${mode.id}`)?.classList.toggle('ending', diff < ENDING_SOON)
                const note = document.getElementById(`note-${mode.id}`)
                if (note) {
                    note.hidden = !reason
                    note.innerText = reason ? `Irregular period: ${reason}` : ''
                }

                const dateEl = document.getElementById(`date-${mode.id}`)
                if (dateEl) {
                    const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }
                    dateEl.innerText = 'Local Time: ' + new Date(mode.targetMs).toLocaleDateString(undefined, options)
                }
            })
        }

        async function init() {
            let data
            try {
                const res = await fetch('resets.json', { cache: 'no-store' })
                if (!res.ok) throw new Error(`HTTP ${res.status}`)
                data = await res.json()
            } catch (e) {
                console.error('Could not load resets.json', e)
                container.innerHTML = location.protocol === 'file:'
                    ? '<p class="status-msg">Couldn\'t load the reset schedule. Browsers block it when the page is opened straight from a file, so view it through GitHub Pages or a local web server.</p>'
                    : '<p class="status-msg">Couldn\'t load the reset schedule. Check your connection and refresh the page.</p>'
                return
            }
            modes = data.modes
            document.getElementById('verified').innerText = data.lastVerified
                ? `Schedule last verified ${new Date(data.lastVerified + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' })}`
                : ''
            renderFilter()
            render()
            applyHidden()
            updateTimers()
            setInterval(updateTimers, 1000)
            regionSelect.addEventListener('change', () => {
                save('endgame.region', regionSelect.value)
                updateTimers()
            })
        }
        init()

        const overlay = document.getElementById('feedback-overlay')
        document.getElementById('open-feedback').addEventListener('click', () => overlay.classList.add('active'))
        document.getElementById('close-feedback').addEventListener('click', () => overlay.classList.remove('active'))
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active') })

        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments) }
        formspree('initForm', { formElement: '#feedback-form', formId: 'xaenbozz' })
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
</body>
</html>
