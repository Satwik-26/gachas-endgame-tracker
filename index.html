<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Endgame Tracker | Live Reset Timers</title>
    <meta name="description" content="Live countdown tracker for all major gacha game endgame resets. Track Memory of Chaos, Spiral Abyss, Shiyu Defense, Tower of Adversity, and more.">
    <meta name="keywords" content="Genshin Impact, Honkai Star Rail, Zenless Zone Zero, Wuthering Waves, endgame tracker, reset timer, Spiral Abyss, Memory of Chaos, Shiyu Defense, Tower of Adversity">
    
    <!-- PASTE YOUR GOOGLE SITE VERIFICATION META TAG ON THE BLANK LINE BELOW -->
    

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 0.5rem;
            text-align: center;
            font-size: 2.5rem;
        }
        .controls {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        select {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1400px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .game-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .mode-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }
        .timer {
            font-size: 2rem;
            font-weight: monospace;
            color: #00ffcc;
            margin-bottom: 1.5rem;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
        .date-display {
            font-size: 0.85rem;
            color: #aaaaaa;
            text-align: center;
            margin-top: auto;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem;
            border-radius: 6px;
        }
        
        .hsr .game-title { color: #d8a56d; }
        .genshin .game-title { color: #ebd9b4; }
        .zzz .game-title { color: #ccff00; }
        .wuwa .game-title { color: #f2e3c6; }
    </style>
</head>
<body>

    <h1>Endgame Resets</h1>
    
    <div class="controls">
        <label for="region-select">Server Region</label>
        <select id="region-select">
            <option value="8">Asia (UTC+8)</option>
            <option value="-5">America (UTC-5)</option>
            <option value="1">Europe (UTC+1)</option>
        </select>
    </div>

    <div class="grid" id="tracker-grid"></div>

    <script>
        const modes = [
            { id: 'moc', name: 'Memory of Chaos', game: 'Honkai Star Rail', class: 'hsr', anchorUTC: Date.UTC(2026, 8, 21, 20, 0, 0), days: 42 },
            { id: 'pf', name: 'Pure Fiction', game: 'Honkai Star Rail', class: 'hsr', anchorUTC: Date.UTC(2026, 9, 19, 20, 0, 0), days: 42 },
            { id: 'as', name: 'Apocalyptic Shadow', game: 'Honkai Star Rail', class: 'hsr', anchorUTC: Date.UTC(2026, 9, 5, 20, 0, 0), days: 42 },
            { id: 'sa', name: 'Spiral Abyss', game: 'Genshin Impact', class: 'genshin', type: 'monthly', resetDay: 16 },
            { id: 'it', name: 'Imaginarium Theater', game: 'Genshin Impact', class: 'genshin', type: 'monthly', resetDay: 1 },
            { id: 'so', name: 'Stygian Onslaught', game: 'Genshin Impact', class: 'genshin', type: 'monthly', resetDay: 30 },
            { id: 'sd', name: 'Shiyu Defense', game: 'Zenless Zone Zero', class: 'zzz', anchorUTC: Date.UTC(2026, 9, 2, 20, 0, 0), days: 14 },
            { id: 'da', name: 'Deadly Assault', game: 'Zenless Zone Zero', class: 'zzz', anchorUTC: Date.UTC(2026, 9, 9, 20, 0, 0), days: 14 },
            { id: 'toa', name: 'Tower of Adversity', game: 'Wuthering Waves', class: 'wuwa', anchorUTC: Date.UTC(2026, 9, 12, 20, 0, 0), days: 14 },
            { id: 'ww', name: 'Whimpering Wastes', game: 'Wuthering Waves', class: 'wuwa', anchorUTC: Date.UTC(2026, 8, 28, 20, 0, 0), days: 14 }
        ]

        const grid = document.getElementById('tracker-grid')
        const regionSelect = document.getElementById('region-select')

        modes.forEach(mode => {
            const card = document.createElement('div')
            card.className = `card ${mode.class}`
            card.innerHTML = `
                <div class="game-title">${mode.game}</div>
                <div class="mode-title">${mode.name}</div>
                <div class="timer" id="timer-${mode.id}">Loading...</div>
                <div class="date-display" id="date-${mode.id}"></div>
            `
            grid.appendChild(card)
        })

        function calculateMonthlyReset(day, offset) {
            const nowLocal = new Date().getTime() + (offset * 3600000)
            const d = new Date(nowLocal)
            let targetMonth = d.getUTCMonth()
            let targetYear = d.getUTCFullYear()
            
            if (d.getUTCDate() > day || (d.getUTCDate() === day && d.getUTCHours() >= 4)) {
                targetMonth++
                if (targetMonth > 11) {
                    targetMonth = 0
                    targetYear++
                }
            }
            const targetUTC = Date.UTC(targetYear, targetMonth, day, 4, 0, 0)
            return targetUTC - (offset * 3600000)
        }

        function calculateCycleReset(anchor, days, offset) {
            const now = new Date().getTime()
            const regionShift = (8 - offset) * 3600000
            const regionAnchor = anchor + regionShift
            const cycleMs = days * 24 * 3600000
            const elapsed = now - regionAnchor
            let remaining = cycleMs - (elapsed % cycleMs)
            if (remaining === cycleMs) remaining = 0
            if (elapsed < 0) return regionAnchor
            return now + remaining
        }

        function updateTimers() {
            const offset = parseFloat(regionSelect.value)
            const now = new Date().getTime()

            modes.forEach(mode => {
                let targetMs
                if (mode.type === 'monthly') {
                    targetMs = calculateMonthlyReset(mode.resetDay, offset)
                } else {
                    targetMs = calculateCycleReset(mode.anchorUTC, mode.days, offset)
                }

                const diff = targetMs - now
                const timerEl = document.getElementById(`timer-${mode.id}`)
                const dateEl = document.getElementById(`date-${mode.id}`)

                if (diff <= 0) {
                    timerEl.innerText = "RESETTING NOW"
                    return
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24))
                const h = Math.floor((diff / (1000 * 60 * 60)) % 24)
                const m = Math.floor((diff / 1000 / 60) % 60)
                const s = Math.floor((diff / 1000) % 60)

                timerEl.innerText = `${d}d ${h}h ${m}m ${s}s`
                
                const resetDate = new Date(targetMs)
                dateEl.innerText = "Local Reset: " + resetDate.toLocaleString()
            })
        }

        setInterval(updateTimers, 1000)
        regionSelect.addEventListener('change', updateTimers)
        updateTimers()
    </script>
</body>
</html>
